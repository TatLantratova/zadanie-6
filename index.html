<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="slider-container">
        <div class="slider-frame">
            <div class="slider-images" id="sliderImages">
                <img src="1.jpg" alt="Mountain Lake Sunset" class="slider-image">
                <img src="4.jpg" alt="Tulip Close-up" class="slider-image">
                <img src="5.jpg" alt="Pink Gerbera Daisy" class="slider-image">
            </div>
            <div class="navigation-button" id="nextButton"></div>
        </div>
        <div class="dot-indicators" id="dotIndicators">
            <div class="dot active" data-index="0"></div>
            <div class="dot" data-index="1"></div>
            <div class="dot" data-index="2"></div>
        </div>
    </div>

    <script src="new.js"></script>
</body>
</html>
